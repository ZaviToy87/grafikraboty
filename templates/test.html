<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест кодировки</title>
</head>
<body style="font-family: Arial; padding: 20px;">
    <h1>Тест кодировки UTF-8</h1>
    
    <h2>Если видите это — кодировка работает:</h2>
    <ul>
        <li>Привет</li>
        <li>ВетГид</li>
        <li>График</li>
        <li>Администратор</li>
        <li>Валерия</li>
        <li>Ольга</li>
    </ul>
    
    <h2>Тест кнопок:</h2>
    <button style="padding: 10px 20px; margin: 5px; background: #6366f1; color: white; border: none; border-radius: 5px;">📤 Telegram</button>
    <button style="padding: 10px 20px; margin: 5px; background: #0077FF; color: white; border: none; border-radius: 5px;">📤 ВКонтакте</button>
    
    <h2>Тест CSS:</h2>
    <div style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 20px; border-radius: 10px; color: white; margin: 20px 0;">
        Градиент работает!
    </div>
    
    <h2>Если видите русский текст нормально — всё работает!</h2>
    <p>Тогда проблема в кэше браузера. Очистите: Ctrl+Shift+Delete</p>
</body>
</html>
